version: 2
# Dependency policy: security fixes only. See open-pull-requests-limit below.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    # POLICY: security-only. Limit 0 turns OFF routine version-bump PRs.
    # Security-update PRs (alert-driven) are NOT affected by this limit and
    # still open automatically. Bump without a CVE only when we need a
    # feature or fix, as a deliberate manual change.
    open-pull-requests-limit: 0
    # Only "dependencies" here. The "security" label is applied automatically
    # by .github/workflows/dependabot-labels.yml — but ONLY to genuine
    # alert-driven security updates (those with a GHSA id), never to plain
    # version bumps. This keeps the "security" tag meaningful.
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # These pin each other's versions (langgraph -> langchain-core,
      # langchain-openai -> openai, langchain-core -> langsmith). Bumped as
      # separate PRs they fail pip resolution (see #162/#164), so bump together.
      langchain-ecosystem:
        patterns:
          - "langchain-*"
          - "langgraph"
          - "langsmith"
          - "openai"
    ignore:
      # Park major upgrades that are breaking changes / carry runtime risk for
      # this app. Minor & patch updates (including security) still flow. Revisit
      # these deliberately, not via auto-PR. Reversible: delete the entry.
      # pinecone v9 = major API rewrite; our KB layer targets the v8 client.
      - dependency-name: "pinecone"
        update-types: ["version-update:semver-major"]
      # langchain majors move fast and break agent/LangGraph wiring.
      - dependency-name: "langchain-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    # POLICY: security-only. Limit 0 turns OFF routine version-bump PRs.
    # Security-update PRs (alert-driven) are NOT affected by this limit and
    # still open automatically. Bump without a CVE only when we need a
    # feature or fix, as a deliberate manual change.
    open-pull-requests-limit: 0
    # Only "dependencies" here. The "security" label is applied automatically
    # by .github/workflows/dependabot-labels.yml — but ONLY to genuine
    # alert-driven security updates (those with a GHSA id), never to plain
    # version bumps. This keeps the "security" tag meaningful.
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
    ignore:
      # react-router-dom: pinned to v6. Every currently-published version carries
      # at least one advisory, and none are reachable in our declarative
      # BrowserRouter SPA (no SSR, no RSC/framework mode):
      #   - v6.x: open redirect (moderate) — below our --audit-level=high gate.
      #   - v7.12.0–8.2.0: RSC Mode CSRF Bypass (HIGH) — would FAIL the daily scan.
      # The open-redirect fix (>7.17.0) only exists inside the RSC-CSRF range, so
      # there is no clean version yet. Staying on v6 keeps the scan green.
      # Revisit when a react-router release clears BOTH advisories (>8.2.0).
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # Park frontend framework majors — breaking, and CI confirmed they don't
      # build against our code yet. Minor/patch (incl. security) still flow.
      # Revisit deliberately: react 19, tailwind v4 are real migrations.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
